version = 1

[render]
algorithm = "baseline"
max_width = 16384
height = 1024
color = "black"
stroke_width = 3.0
circle = true
orientation = "recording"
detail = 16
deformation = 0.24
nominal_radius = 0.40
roundness = 0.15
points = 512
fitting = "fourier"
smoothness = 0.3333
baseline_gain = 19.2

[preprocess]
trim_method = "rms"
trim_trigger_db = -20.0
trim_db = -30.0
trim_padding_ms = 20.0
normalize_peak = 0.9

[features]
window_ms = 20.0
hop_ms = 10.0
compression = 0.5
energy_weight = 3.96
timbre_weight = 2.64
timbre_mode = "residual"
pitch_weight = 1.35
bands_hz = [0.0, 500.0, 1500.0, 3000.0, 24000.0]
band_weights = [-1.0, -0.3, 0.3, 1.0]
pitch_reference_hz = 220.0
pitch_octaves = 2.0
pitch_inflection_octaves = 0.5
pitch_absolute_weight = 0.6
pitch_inflection_weight = 0.4

[pitch_estimation]
floor_hz = 60.0
ceiling_hz = 600.0
hop_ms = 10.0
voicing_threshold = 0.45
